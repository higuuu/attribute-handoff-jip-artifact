name: oss-live-age
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: synthetic-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: synthetic-admin-local-only
    volumes:
      - ./realm.json:/opt/keycloak/data/import/live-age-realm.json:ro
    ports:
      - "127.0.0.1:18880:8080"
